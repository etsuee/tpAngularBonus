<h1>{{ appName }}</h1>
<p>Bonjour {{ userName }}</p>

<p>Nous summes en {{ 2020 + 6 }}. Votre prénom compte {{ userName.length }} lettres.</p>
<p>En majuscules : {{ userName.toUpperCase() }}</p>

<!-- type="button" : ce bouton ne sert pas à envoyer un formulaire-->
<button type="button" (click)="sayHello()">Dire Bonjour</button>

<!-- aria-live : le lecteur d'écran annonce le message quand il apparait-->
<p aria-live="polite">{{ message }}</p>

<button type="button" (click)="clearMessage()">Effacer</button>

<div>
  <input type="text" />

  <p>Vous tapez:</p>
</div>

<section aria-labelledby="status-title">
  <h2 id="status-title">Mon statut aujourd'hui</h2>
  <p>
    Vous êtes : <strong>{{ status() }}</strong>
  </p>

  <button type="button" (click)="changeStatus('sur site')">Sur site</button>
  <button type="button" (click)="changeStatus('en télétravail')">En télétravail</button>
  <button type="button" (click)="changeStatus('absent')">Absent</button>
</section>
<router-outlet />
