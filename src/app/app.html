<header class="header">
  <span class="app-name">{{ appName }}</span>
  <nav aria-label="Navigation principale">
    <!-- routerLink: change de page sans recharger
    routerLinkActive: ajoute la classe "active" au lien de la page affichee
    ariaCurrentWhenActive: annonce "page actuelle" au lecteur d'écran-->
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      Accueil
    </a>
    <a routerLink="/equipe" routerLinkActive="active" ariaCurrentWhenActive="page">Equipe</a>

    <a routerLink="/ajouter" routerLinkActive="active" ariaCurrentWhenActive="page">Ajouter</a>
  </nav>
</header>

<main class="container">
  <!-- la page correspondant à l'adresse s'affiche ici -->
  <router-outlet />
</main>
